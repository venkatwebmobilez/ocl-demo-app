name: OCI Terraform

on:
  pull_request:
    paths:
      - "Terraform/**"
      - ".github/workflows/OCI.yml"
  push:
    branches:
      - main
    paths:
      - "Terraform/**"
      - ".github/workflows/OCI.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Choose plan or apply."
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: Terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      public_ip: ${{ steps.public_ip.outputs.public_ip }}
    defaults:
      run:
        shell: bash
        working-directory: Terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Export Terraform variables
        run: |
          {
            echo "TF_VAR_tenancy_ocid=${{ secrets.OCI_TENANCY_OCID }}"
            echo "TF_VAR_user_ocid=${{ secrets.OCI_USER_OCID }}"
            echo "TF_VAR_fingerprint=${{ secrets.OCI_FINGERPRINT }}"
            echo "TF_VAR_private_key_path=/tmp/oci_api_key.pem"
            echo "TF_VAR_region=${{ secrets.OCI_REGION }}"
            echo "TF_VAR_compartment_id=${{ secrets.OCI_COMPARTMENT_OCID }}"
            echo "TF_VAR_instance_image_id=${{ secrets.OCI_IMAGE_OCID }}"
            echo "TF_VAR_ssh_public_key=${{ secrets.OCI_SSH_PUBLIC_KEY }}"
          } >> "$GITHUB_ENV"

      - name: Write OCI API key
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$OCI_PRIVATE_KEY" > /tmp/oci_api_key.pem
          chmod 600 /tmp/oci_api_key.pem

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Show public IP
        id: public_ip
        if: github.event.inputs.action == 'apply'
        run: |
          PUBLIC_IP=$(terraform output -raw public_ip)
          echo "Public IP: $PUBLIC_IP"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"
          {
            echo "### OCI Instance Public IP"
            echo ""
            echo "$PUBLIC_IP"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_app:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build jar
        run: ./gradlew clean bootJar

      - name: Write SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.OCI_DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/oci_deploy_key
          chmod 600 ~/.ssh/oci_deploy_key

      - name: Trust host key
        env:
          DEPLOY_HOST: ${{ needs.deploy.outputs.public_ip }}
        run: |
          mkdir -p ~/.ssh
          for attempt in 1 2 3 4 5 6; do
            if ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts; then
              exit 0
            fi
            sleep 10
          done
          echo "Failed to fetch SSH host key for $DEPLOY_HOST" >&2
          exit 1

      - name: Copy jar to OCI instance
        env:
          DEPLOY_HOST: ${{ needs.deploy.outputs.public_ip }}
          DEPLOY_USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          JAR_FILE=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*plain.jar' | head -n 1)
          test -n "$JAR_FILE"
          scp -i ~/.ssh/oci_deploy_key "$JAR_FILE" "${DEPLOY_USER}@${DEPLOY_HOST}:demo.jar"

      - name: Restart app
        env:
          DEPLOY_HOST: ${{ needs.deploy.outputs.public_ip }}
          DEPLOY_USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          ssh -i ~/.ssh/oci_deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" <<'EOF'
          set -e
          pkill -f 'java -jar demo.jar' || true
          nohup java -jar demo.jar > demo.log 2>&1 &
          EOF
