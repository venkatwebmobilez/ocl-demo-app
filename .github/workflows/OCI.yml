name: OCI Terraform

on:
  pull_request:
    paths:
      - "Terraform/**"
      - ".github/workflows/OCI.yml"
  push:
    branches:
      - main
    paths:
      - "Terraform/**"
      - ".github/workflows/OCI.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Choose plan or apply."
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: Terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: Terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Export Terraform variables
        run: |
          {
            echo "TF_VAR_tenancy_ocid=${{ secrets.OCI_TENANCY_OCID }}"
            echo "TF_VAR_user_ocid=${{ secrets.OCI_USER_OCID }}"
            echo "TF_VAR_fingerprint=${{ secrets.OCI_FINGERPRINT }}"
            echo "TF_VAR_private_key_path=/tmp/oci_api_key.pem"
            echo "TF_VAR_region=${{ secrets.OCI_REGION }}"
            echo "TF_VAR_compartment_id=${{ secrets.OCI_COMPARTMENT_OCID }}"
            echo "TF_VAR_instance_image_id=${{ secrets.OCI_IMAGE_OCID }}"
            echo "TF_VAR_ssh_public_key=${{ secrets.OCI_SSH_PUBLIC_KEY }}"
          } >> "$GITHUB_ENV"

      - name: Write OCI API key
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$OCI_PRIVATE_KEY" > /tmp/oci_api_key.pem
          chmod 600 /tmp/oci_api_key.pem

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan
